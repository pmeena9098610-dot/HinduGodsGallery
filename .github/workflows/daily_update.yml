name: 🕉️ Daily Auto AI Image Generator & Deploy

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  generate-daily-god-images:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎨 Run Auto AI Image Generator & SEO Updater
        run: |
          python auto_update.py

      - name: 🚀 Commit and Push Updated Gallery
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🕉️ Auto-generated 10 new cute divine god images for today [skip ci]"
          branch: main
          file_pattern: "images_data.json sitemap.xml images/* auto_update.log"
